# A throwaway MySQL in Docker (Testcontainers), shared by every test in the run. Flyway creates the tables,
# and "validate" fails the tests if the migrations don't match the entities.
spring.datasource.url=jdbc:tc:mysql:8.4:///bubblediary
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# No key, so AI replies fail fast and tests never call OpenRouter.
openrouter.api-key=
