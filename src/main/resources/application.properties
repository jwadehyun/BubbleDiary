spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bubblediary?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway creates and changes tables (src/main/resources/db/migration). Hibernate only checks they match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Show the reason in error responses (e.g. "Photo is too large") so the front end can display it.
spring.web.error.include-message=always

# OAuth login with Google. Create credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URIs: http://localhost:8080/login/oauth2/code/google and http://localhost:5173/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional: GitHub login too. Uncomment and set GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET in .env.
# Callback URL: http://localhost:8080/login/oauth2/code/github (or :5173 while using the Vite dev server)
#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
#spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Mobile app sign-in. The app signs in natively with Google/Apple, then trades that ID token for our own tokens.
# Native Google sign-in issues tokens for the web client id; add the iOS/Android client ids too if you use them.
app.auth.google-client-ids=${GOOGLE_CLIENT_ID},${GOOGLE_MOBILE_CLIENT_IDS:}
# Sign in with Apple: the iOS app's bundle id, e.g. com.yourname.bubblediary
app.auth.apple-client-ids=${APPLE_BUNDLE_ID:}
# Sign-in by name only, for developing the mobile app before Google/Apple are set up. NEVER true in production.
app.auth.dev-login=${DEV_LOGIN:false}
# Development only: lets the app's web preview (npx expo start --web) call the server, e.g. http://localhost:8081
app.cors.allowed-origins=${CORS_ORIGINS:}
# Signs the app's access tokens. Any random string of 32+ characters, e.g. from: openssl rand -base64 48
app.jwt.secret=${APP_JWT_SECRET:}

# AI fan replies. Get a key at https://openrouter.ai/keys
openrouter.api-key=${OPENROUTER_API_KEY:}
# The model writing each plan's replies. Users can't change it, because the server's key pays for every call.
# Free models are fine for development; in production use a cheap paid one, e.g. anthropic/claude-haiku-5.5.
openrouter.model.free=${OPENROUTER_MODEL_FREE:google/gemma-4-31b-it:free}
openrouter.model.premium=${OPENROUTER_MODEL_PREMIUM:${openrouter.model.free}}