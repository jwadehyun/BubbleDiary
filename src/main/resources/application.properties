spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/bubblediary?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Show the reason in error responses (e.g. "Photo is too large") so the front end can display it.
server.error.include-message=always

# OAuth login with Google. Create credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URIs: http://localhost:8080/login/oauth2/code/google and http://localhost:5173/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Optional: GitHub login too. Uncomment and set GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET in .env.
# Callback URL: http://localhost:8080/login/oauth2/code/github (or :5173 while using the Vite dev server)
#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
#spring.security.oauth2.client.registration.github.scope=read:user,user:email

# AI fan replies. Get a key at https://openrouter.ai/keys
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.default-model=google/gemma-4-31b-it:free
# The server's key pays for every user's replies, so only free models are offered unless this is true.
openrouter.allow-paid=${OPENROUTER_ALLOW_PAID:false}